name: Build and publish documentation site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned packages
        run: npm ci
      - name: Build the social preview image
        run: node scripts/site/build-social-preview.mjs
      - name: Build the documentation and landing site
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        # Defaults to /gtha-transit/ on https://ding-ding-projects.github.io,
        # the exact project-site URL this repository publishes to. A fork
        # would need its own --base/--origin, since GitHub Pages verifies a
        # custom domain to a single repository and a detached fork serves at
        # its own owner/name path (see docs/interface/documentation-site.md).
        run: node scripts/site/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
