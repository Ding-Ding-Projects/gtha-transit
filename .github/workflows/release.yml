name: Build and publish web release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record workflow start
        run: date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/workflow-started
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned packages
        run: npm ci
      - name: Build and package
        run: |
          npm run build
          node scripts/package-release.mjs
          node scripts/count-lines.mjs > dist/line-counts.md
      - name: Enable emulation for the other architecture
        uses: docker/setup-qemu-action@v3
      - name: Enable buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish the web container image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Built from the same commit the release is cut from, so a host deploys by
          # pulling rather than by rebuilding from a source tarball. Only the web
          # service is published: the routing API needs generated stop, route and
          # pattern indexes that this repository carries as placeholders, so a runner
          # cannot build a working one.
          TAG="v0.1.0-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/gtha-transit-web"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Both architectures, because the runner is amd64 and the deploy host is
          # arm64. A single-architecture image pulls without complaint and then
          # crash-loops, which is a worse failure than not publishing one at all.
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$TAG" -t "$IMAGE:latest" --metadata-file dist/buildx.json --push .
          # The manifest-list digest names the exact bytes for every architecture,
          # so the release points at those rather than at a tag anyone could move.
          DIGEST="$IMAGE@$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("dist/buildx.json","utf8"))["containerimage.digest"])')"
          # Prove the published manifest actually carries both.
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' | tee dist/platforms.txt
          grep -q 'linux/amd64' dist/platforms.txt
          grep -q 'linux/arm64' dist/platforms.txt
          node -e 'require("fs").writeFileSync("dist/image.json", JSON.stringify({ image: process.argv[1], tag: process.argv[2], digest: process.argv[3] }))' "$IMAGE" "$TAG" "$DIGEST"
          echo "Published $DIGEST"

      - name: Publish unique release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.0-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          export TAG
          # A code name is decoration with a purpose and must never block a release.
          # Exit 3 means no unused dish with a published photo could be resolved, and
          # the notes then carry the version alone.
          ASSETS="dist/gtha-transit-web.tar.gz dist/line-counts.md"
          if node scripts/dim-sum-code-name.mjs --json --photo dist/dim-sum.png > dist/dim-sum.json; then
            PHOTO_FILE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('dist/dim-sum.json','utf8')).file)")
            mv dist/dim-sum.png "dist/$PHOTO_FILE"
            ASSETS="$ASSETS dist/$PHOTO_FILE"
            echo "Code name resolved: $(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('dist/dim-sum.json','utf8')).name)")"
          else
            rm -f dist/dim-sum.json dist/dim-sum.png
            echo "::warning::No unused dim sum code name with a published photo was resolved; this release ships without one."
          fi
          node scripts/release-notes.mjs
          gh release create "$TAG" $ASSETS --target "$GITHUB_SHA" --title "GTHA Transit $TAG" --notes-file dist/release-notes.md
      - name: Retain build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: |
            dist/gtha-transit-web.tar.gz
            dist/line-counts.md
            dist/release-notes.md
          if-no-files-found: warn
          retention-days: 7
