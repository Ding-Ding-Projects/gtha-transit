services:
  otp:
    image: eclipse-temurin:25-jre
    command: ["java", "-Xms2g", "-Xmx8g", "-XX:+UseG1GC", "-jar", "/var/otp/otp.jar", "--load", "--serve", "/var/otp"]
    cpus: 4
    mem_limit: 9g
    restart: unless-stopped
    volumes: ["./runtime/otp:/var/otp:ro"]
  api:
    build: {context: .., dockerfile: backend/Dockerfile}
    ports: ["${ROUTING_BIND_ADDRESS:-127.0.0.1}:8787:8787"]
    restart: unless-stopped
    depends_on: [otp]
    expose: ["8788"]
    environment: {METROLINX_KEY_FILE: /run/secrets/metrolinx-api-key}
    volumes: ["./runtime/feeds/manifest.json:/data/feeds/manifest.json:ro", "./runtime/otp/graph-provenance.json:/data/graph-provenance.json:ro", "./runtime/secrets:/run/secrets:ro"]
