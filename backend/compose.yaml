services:
  otp:
    image: eclipse-temurin:25-jre
    command: ["java", "-Xms2g", "-Xmx8g", "-XX:+UseG1GC", "-jar", "/var/otp/otp.jar", "--load", "--serve", "/var/otp"]
    cpus: 4
    mem_limit: 9g
    restart: unless-stopped
    # The routing API runs on another host and reaches OpenTripPlanner through
    # this port. Without it every journey fails. The routing host's .env sets
    # OTP_BIND_ADDRESS to its LAN address; the default keeps a fresh checkout
    # from exposing the router.
    ports: ["${OTP_BIND_ADDRESS:-127.0.0.1}:8790:8080"]
    volumes: ["./runtime/otp:/var/otp:ro"]
  # The public routing API (server.mjs) runs on a separate host, not here. This
  # host only needs to feed OTP's own stop-time-updaters, which reach the
  # Metrolinx key through this proxy at the service alias "api" - the alias
  # keeps router-config.json's existing updater URLs resolving unchanged.
  metrolinx-proxy:
    # One image for the three Node services. The tag is named so a boot-time
    # `docker compose up -d` reuses the image that was deployed instead of
    # rebuilding from whatever source happens to sit on the host.
    image: gtha-transit-backend:${BACKEND_IMAGE_TAG:-local}
    build: {context: .., dockerfile: backend/Dockerfile}
    command: ["node", "metrolinx-proxy.mjs"]
    expose: ["8788"]
    restart: unless-stopped
    environment: {METROLINX_KEY_FILE: /run/secrets/metrolinx-api-key}
    volumes: ["./runtime/secrets:/run/secrets:ro"]
    networks: {default: {aliases: [api]}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/internal/metrolinx/status').then(r=>r.json()).then(j=>{if(j.credential!=='readable')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  # Joins the TTC's live vehicle positions to the loaded timetable by a
  # verified method other than identifier matching (see
  # docs/vehicles/trip-identifiers.md). Setting TTC_MATCHER_URL to this
  # service on the routing-API host is what flips backend/live-coverage.mjs's
  # TTC state from "published-unjoinable" to "shadow".
  ttc-matcher:
    image: gtha-transit-backend:${BACKEND_IMAGE_TAG:-local}
    build: {context: .., dockerfile: backend/Dockerfile}
    command: ["node", "ttc-trip-matcher.mjs"]
    expose: ["8790"]
    environment: {OTP_URL: "http://otp:8080", TTC_MATCHER_PORT: "8790"}
    restart: unless-stopped
    depends_on: [otp]
  # Publishes only the matcher's sanitized counters to the routing API on the
  # other host (its TTC_MATCHER_URL), never the rewritten feed itself.
  ttc-stats-proxy:
    image: gtha-transit-backend:${BACKEND_IMAGE_TAG:-local}
    build: {context: .., dockerfile: backend/Dockerfile}
    command: ["node", "ttc-stats-proxy.mjs"]
    ports: ["${TTC_STATS_BIND_ADDRESS:-127.0.0.1}:18791:8791"]
    environment: {TTC_MATCHER_UPSTREAM: "http://ttc-matcher:8790", TTC_MATCHER_FEED: "ttc-next", PORT: "8791"}
    restart: unless-stopped
    depends_on: [ttc-matcher]
